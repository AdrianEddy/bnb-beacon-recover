[package]
name = "bbc-submit"
description = "Online half of a BNB Beacon Chain token recovery: official approval API, simulation, Ledger-signed submission, withdrawal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
alloy = { version = "2", features = ["full", "signer-ledger"] }
bbc-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
alloy-json-rpc = "2"
